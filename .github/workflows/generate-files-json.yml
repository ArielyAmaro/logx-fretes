name: Generate files.json

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate files.json
        run: |
          python3 - <<'EOF'
          import json, os, re

          files = [
            f for f in os.listdir('.')
            if f.endswith('.json')
            and ' ' not in f
            and '(' not in f
            and f != 'files.json'
          ]
          files.sort()

          with open('files.json', 'w') as out:
            json.dump(files, out, ensure_ascii=False, indent=2)

          print(f"Generated files.json with {len(files)} files:")
          for f in files:
            print(f"  {f}")
          EOF

      - name: Commit files.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add files.json
          git diff --staged --quiet || git commit -m "Auto: update files.json"
          git push
